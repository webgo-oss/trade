<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSE Trades</title>
<style>
:root{--bg:#f6f7f4;--ink:#16211c;--mut:#66716b;--line:#dfe3dc;--acc:#0b6b4d;--new:#e6f4ec;--warn:#b26a00;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101613;--ink:#e7ede9;--mut:#8b968f;--line:#25302a;--acc:#4cc38f;--new:#173226;--warn:#e2a13b;--card:#161d19}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line)}
h1{margin:0;font:600 22px Georgia,serif}
.status{display:flex;align-items:center;gap:10px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}.pulling .dot{background:var(--warn);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.pulling .dot{animation:none}}
button{font:inherit;padding:7px 14px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stats{display:flex;gap:32px;padding:16px 28px}.stats b{display:block;font:600 20px Georgia,serif}.stats span{color:var(--mut)}
.bar{padding:0 28px 12px}input{width:min(320px,100%);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.wrap{margin:0 28px 28px;border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:8px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.new td{background:var(--new)}.toast{color:var(--acc);font-weight:500}
</style></head><body>
<header>
  <h1>BSE trades</h1>
  <div class="status" id="status"><span class="dot"></span><span id="msg">Connecting…</span>
    <button id="pull">Pull now</button></div>
</header>
<div class="stats"><div><b id="total">0</b><span>trades loaded</span></div><div><b id="pulls">0</b><span>pulls completed</span></div><div><b id="last">–</b><span>last pull</span></div></div>
<div class="bar"><input id="q" placeholder="Filter by client, symbol or trade ID" aria-label="Filter trades"> <span id="toast" class="toast"></span></div>
<div class="wrap"><table><thead><tr><th>Trade ID</th><th>Client</th><th>Symbol</th><th class="n">Quantity</th><th class="n">Price (₹)</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const $ = id => document.getElementById(id), MAX = 500;
let all = [], fresh = new Set(), st = {}, timer;
const fmt = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2 });
function render() {
  const q = $('q').value.toLowerCase();
  const list = all.filter(t => !q || (t.client + t.symbol + t.tradeId).toLowerCase().includes(q));
  list.sort((a, b) => b.timestamp.localeCompare(a.timestamp));
  $('rows').innerHTML = list.slice(0, MAX).map(t => `<tr class="${fresh.has(t.tradeId) ? 'new' : ''}"><td>${t.tradeId}</td><td>${t.client}</td><td>${t.symbol}</td><td class="n">${t.quantity}</td><td class="n">${fmt.format(t.price)}</td><td>${new Date(t.timestamp).toLocaleTimeString()}</td></tr>`).join('');
  $('total').textContent = all.length.toLocaleString('en-IN');
}
function status() {
  clearInterval(timer);
  $('status').classList.toggle('pulling', !!st.pulling);
  $('pull').disabled = !!st.pulling;
  $('pulls').textContent = st.pulls || 0;
  $('last').textContent = st.lastPullAt ? new Date(st.lastPullAt).toLocaleTimeString() : '–';
  const tick = () => { const s = Math.max(0, Math.round((st.etaAt - Date.now()) / 1000));
    $('msg').textContent = `Pull in progress, about ${Math.floor(s / 60)}m ${s % 60}s left. Showing trades already pulled.`; };
  if (st.pulling) { tick(); timer = setInterval(tick, 1000); } // UI countdown only; no server calls
  else $('msg').textContent = 'Up to date';
}
fetch('/api/trades').then(r => r.json()).then(d => { all = d.trades; st = d.state; render(); status(); });
const es = new EventSource('/events');
es.addEventListener('state', e => { st = JSON.parse(e.data); status(); });
es.addEventListener('trades', e => {
  const t = JSON.parse(e.data); if (!t.length) return;
  fresh = new Set(t.map(x => x.tradeId)); all = all.concat(t); render();
  $('toast').textContent = `${t.length} new trades added`; setTimeout(() => $('toast').textContent = '', 6000);
});
$('pull').onclick = () => fetch('/api/pull', { method: 'POST' });
$('q').oninput = render;
</script></body></html>
